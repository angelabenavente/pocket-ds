<svg width="272" height="64" viewBox="0 0 272 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pocket DS</title>
  <desc id="desc">Logo for the Pocket DS design system: a compact pocket-shaped symbol with a modular token and a lowercase wordmark.</desc>

  <!-- Symbol -->
  <g transform="translate(4 4)">
    <rect width="56" height="56" rx="16" fill="#6C5CE7"/>
    <path d="M14 17.5C14 15.567 15.567 14 17.5 14H38.5C40.433 14 42 15.567 42 17.5V31.5C42 38.404 36.404 44 29.5 44H26.5C19.596 44 14 38.404 14 31.5V17.5Z" fill="white" fill-opacity="0.16"/>
    <path d="M15 19H41" stroke="white" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="24" y="25" width="8" height="8" rx="2.4" fill="white"/>
  </g>

  <!-- Wordmark -->
  <text x="76" y="41" fill="#151515"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="700" letter-spacing="-1.2">pocket</text>

  <!-- DS badge -->
  <rect x="186" y="16" width="54" height="34" rx="17" fill="#EFEAFE"/>
  <text x="213" y="39.5" text-anchor="middle" fill="#5B4BD8"
        font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="800" letter-spacing="-0.4">ds</text>
</svg>
